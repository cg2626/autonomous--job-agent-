services:
  job-agent-api:
    build: ./backend
    container_name: sastra_job_agent_api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://job-agent-redis:6379/0
    depends_on:
      job-agent-redis:
        condition: service_healthy
    restart: unless-stopped

  job-agent-redis:
    image: redis:7-alpine
    container_name: sastra_job_agent_redis
    command: redis-server --appendonly yes
    volumes:
      - job_agent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  job_agent_redis_data:
